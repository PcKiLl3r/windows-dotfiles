#? Config file for btop4win -- mirrors the behavior of ~/.config/btop/btop.conf
#? on the Omarchy machine. That file points color_theme at "current"
#? (Omarchy's generated theme symlink); there's no such mechanism here, so
#? this points directly at the vendored tokyo-night theme file instead
#? (themes/tokyo-night.theme, copied verbatim from
#? ~/.local/state/omarchy/current/theme/btop.theme).
color_theme = "tokyo-night"
theme_background = true
truecolor = true
force_tty = false
disable_presets = "Off"
vim_keys = true
rounded_corners = true
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = false
cpu_graph_upper = "total"
cpu_invert_lower = true
show_cpu_freq = true
clock_format = "%X"
background_update = true
