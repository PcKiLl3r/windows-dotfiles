# YASB bar config -- mirrors the three-section layout of
# ~/.config/omarchy/shell.json (left/center/right), module-for-module where
# a Windows equivalent exists. Dropped with no equivalent: omarchy.agents,
# omarchy.system-update (no Windows update-check widget worth adding),
# OSD (handled natively by Windows volume/brightness overlays).
#
# Verified against https://docs.yasb.dev and
# https://raw.githubusercontent.com/amnweb/yasb-themes/main/themes/83e8a5f3-45d4-4ba1-8b2c-b97871cde018/config.yaml
# (an earlier draft of this file had the komorebi widget types wrong and
# was missing required top-level keys -- see windows-setup plan history).
watch_stylesheet: true
watch_config: true
debug: false

komorebi:
  start_command: "komorebic start --whkd --config \"$HOME/.config/komorebi/komorebi.json\""
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd --config \"$HOME/.config/komorebi/komorebi.json\""

bars:
  omarchy:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true      # reserves screen space so komorebi tiles below the bar instead of under it
      hide_on_fullscreen: true   # lets fullscreen games (Steam/Battle.net) take the whole screen
    dimensions:
      width: "100%"
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["launcher_button", "komorebi_workspaces"]
      center: ["clock", "komorebi_layout", "language", "weather"]
      right: ["systray", "bluetooth", "wifi", "volume", "cpu", "memory", "battery"]

widgets:
  launcher_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span></span>"   # matches omarchy.menu icon slot
      exec_cmd: "Flow.Launcher.exe"

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      hide_empty_workspaces: false

  komorebi_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%A %H:%M}"               # matches shell.json's "dddd HH:mm"
      label_alt: "{%-d %B W%V %Y}"      # matches shell.json alt format
      update_interval: 1000

  language:
    type: "yasb.language.LanguageWidget"

  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      update_interval: 1800

  systray:
    type: "yasb.systray.SystrayWidget"

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"

  wifi:
    type: "yasb.wifi.WifiWidget"

  volume:
    type: "yasb.volume.VolumeWidget"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      update_interval: 2000

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      update_interval: 2000

  battery:
    type: "yasb.battery.BatteryWidget"
